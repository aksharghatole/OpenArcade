name: Falling Blocks checks
on:
  pull_request:
    paths:
      - 'games/falling-blocks/**'
      - 'tests/falling-blocks*'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/falling-blocks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/falling-blocks.test.cjs
      - run: npm install --no-save --no-package-lock playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/openarcade-http.log 2>&1 &
          trap 'kill $!' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          node tests/falling-blocks.browser.cjs
