name: Freedoom integration candidate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/*freedoom*'
      - 'docs/freedoom.md'
      - 'tests/freedoom-browser.cjs'
      - '.github/workflows/freedoom.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: emscripten/emsdk:4.0.10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GMH-Code/Dwasm
          ref: ddf0347a4fc115b11ffb1c5710768b7c47c46698
          path: upstream
          persist-credentials: false
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ cmake make pkg-config libsdl2-dev libsdl2-mixer-dev zip
      - name: Fetch official game data and build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/upstream"
          python3 scripts/fetch-freedoom.py "$GITHUB_WORKSPACE/assets"
          bash scripts/build-freedoom.sh upstream assets "$GITHUB_WORKSPACE/candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: freedoom-candidate
          path: candidate/
          retention-days: 3
          if-no-files-found: error
  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.51.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: freedoom-candidate
          path: preview/OpenArcade
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - name: Test both campaigns on nested path
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory preview &
          server=$!
          trap 'kill "$server"' EXIT
          node tests/freedoom-browser.cjs
